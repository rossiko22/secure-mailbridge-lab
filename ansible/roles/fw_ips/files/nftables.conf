#!/usr/sbin/nft -f
# fw-ips ruleset, tasks 1.9a, 1.9b and 1.11: the section 4 policy.
# Written by Claude at Marko's explicit request.

# Start from empty, so loading this file twice gives the same result.
# The whole file loads atomically: a syntax error changes nothing.
flush ruleset

define WAN_IF = "ens5"
define VPN_IF = "tun0"
define FW_IP = 10.0.1.10
define PROXY_IP = 10.0.2.10
define VPC = 10.0.0.0/16
define MGMT = 10.0.5.0/24
define PRIVATE = { 10.0.2.0/24, 10.0.3.0/24, 10.0.4.0/24, 10.0.5.0/24 }
define USER_POOL = 10.8.0.0/24
define ADMIN_POOL = 10.8.1.0/24
define VPN_POOLS = 10.8.0.0/23

table inet fw {
    # Traffic addressed to fw-ips itself.
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # The VPN entry point.
        iifname $WAN_IF udp dport 1194 accept

        # DHCP lease renewal. Losing the lease would take fw-ips offline.
        iifname $WAN_IF udp sport 67 udp dport 68 accept

        # Unbound, from private subnets and VPN clients.
        iifname $WAN_IF ip saddr $PRIVATE ip daddr $FW_IP meta l4proto { tcp, udp } th dport 53 accept
        iifname $VPN_IF ip saddr $VPN_POOLS ip daddr $FW_IP meta l4proto { tcp, udp } th dport 53 accept

        # Tunnel health check, for admins only.
        iifname $VPN_IF ip saddr $ADMIN_POOL icmp type echo-request accept

        # Rate limited so a flood cannot fill the disk. The policy then drops.
        limit rate 10/second burst 20 packets log prefix "FW-INPUT-DROP "
    }

    # Traffic passing through fw-ips.
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Replies to connections already allowed.
        ct state established,related accept

        # Matching tun0 as well as the source address means a forged 10.8.x.x
        # packet arriving on ens5 fits none of these rules.
        iifname $VPN_IF ip saddr $USER_POOL ip daddr $PROXY_IP tcp dport 443 accept
        iifname $VPN_IF ip saddr $ADMIN_POOL ip daddr $PROXY_IP tcp dport 443 accept
        iifname $VPN_IF ip saddr $ADMIN_POOL ip daddr $MGMT accept

        # fw-ips has one interface, so internet traffic enters and leaves on
        # ens5. Only the destination address separates it from VPC traffic.
        iifname $WAN_IF oifname $WAN_IF ip saddr $PRIVATE ip daddr != $VPC tcp dport 443 log prefix "FW-EGRESS " accept
        iifname $WAN_IF oifname $WAN_IF ip saddr $PRIVATE ip daddr != $VPC udp dport 123 log prefix "FW-EGRESS " accept

        # Rate limited so a flood cannot fill the disk. The policy then drops.
        limit rate 10/second burst 20 packets log prefix "FW-DROP "
    }

    # Suricata (task 1.11), after the forward chain. A packet Suricata accepts
    # skips the rest of its chain, so queueing here keeps the firewall rules in
    # force: only traffic allowed above reaches this chain. Without "bypass",
    # traffic stops if Suricata stops, so it can't be turned off to avoid it.
    chain ips {
        type filter hook forward priority filter + 10; policy accept;

        iifname $VPN_IF queue num 0
        oifname $VPN_IF queue num 0
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Only private subnets to the internet. VPN pools are never NATed, so
        # later hosts see the real client address.
        oifname $WAN_IF ip saddr $PRIVATE ip daddr != $VPC snat ip to $FW_IP
    }
}
