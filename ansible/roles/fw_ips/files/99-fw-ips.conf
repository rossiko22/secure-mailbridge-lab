# fw-ips kernel settings, task 1.9a.

# Route packets between hosts. Linux drops them by default.
net.ipv4.ip_forward = 1

# Packets enter and leave on the same interface, so Linux would otherwise tell
# senders to bypass fw-ips. The kernel honours "all" OR the interface value,
# so all three must be 0.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.ens5.send_redirects = 0
