# Installed to /etc/systemd/system/suricata.service.d/nfqueue.conf, task 1.11.
# The packaged service starts in passive --af-packet mode and doesn't read
# /etc/default/suricata. The empty ExecStart clears the packaged command.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -D -q 0 -c /etc/suricata/suricata.yaml --pidfile /run/suricata.pid
